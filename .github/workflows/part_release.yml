on:
  workflow_call:
    inputs:
      releaseName:
        required: true
        type: string
      stable:
        required: false
        type: boolean
        default: false

name: "Release"

permissions:
  contents: read

jobs:
  create:
    name: Create Release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Create prerelease
        if: ${{ !inputs.stable }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          --repo ${{ github.repository }}
          --title ${{ inputs.releaseName }}
          --prerelease
          --generate-notes
          ${{ inputs.releaseName }}
      - name: Create release
        if: ${{ inputs.stable }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          --repo ${{ github.repository }}
          --title ${{ inputs.releaseName }}
          --generate-notes
          ${{ inputs.releaseName }}
            
      - name: "Download Docs Artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: .
      - name: "Download EScript Artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary
          path: .

      - name: Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          --repo ${{ github.repository }}
          --clobber "${{ inputs.releaseName }}"
          docs.tar.gz* oid_certo*
